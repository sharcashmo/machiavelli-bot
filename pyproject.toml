[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "machiavelli"
version = "0.8.0"
description = "Motor y bot de Discord para el juego Machiavelli"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.3.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["machiavelli*"]
exclude = ["tests*", "specs*"]

[tool.setuptools.package-data]
machiavelli = ["*.json"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".Agents", ".agents", ".codegraph", "NUL"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = []
fixable = ["ALL"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
log_cli = true
log_cli_level = "DEBUG"

[tool.coverage.report]
fail_under = 71
